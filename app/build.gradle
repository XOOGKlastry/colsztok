    defaultConfig { applicationId 'pl.colsztok'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
