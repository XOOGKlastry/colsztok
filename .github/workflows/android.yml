name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore application signing key
        env:
          KEY: ${{ secrets.COLSZTOK_SIGNING_KEY }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY" ]; then printf '%s' "$KEY" | base64 --decode > ~/.android/debug.keystore; fi
      - run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Colsztok-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Signing key for first setup
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: signing-setup
          path: ~/.android/debug.keystore
          include-hidden-files: true
          retention-days: 1
      - name: Publish APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Colsztok.apk
          sha256sum Colsztok.apk > Colsztok.apk.sha256
          gh release create "$GITHUB_REF_NAME" Colsztok.apk Colsztok.apk.sha256 --title "Colsztok $GITHUB_REF_NAME" --notes-file RELEASE.md
